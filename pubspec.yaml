name: steel_voice_assistant
description: "炼钢规程语音交互智能体 - 头盔端应用"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  web: ^1.1.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  http: ^1.6.0
  record: ^7.1.0
  path_provider: ^2.1.6
  web_socket_channel: ^3.0.1
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/bg.png
    - assets/bg1.png
    - assets/helmet.png
